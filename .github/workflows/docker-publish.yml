name: Build Push and Deplo

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: hireflow-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: annusingh1211

  GITOPS_REPO: annusingh1211/hireflow-gitops-devops

  BACKEND_IMAGE: ghcr.io/annusingh1211/hireflow-backend
  FRONTEND_IMAGE: ghcr.io/annusingh1211/hireflow-frontend

jobs:

  build-and-push:

    name: Build and Push Images

    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image-tag.outputs.tag }}

    steps:

      - name: Checkout Application Repository
        uses: actions/checkout@v6

      - name: Generate Incremental Image Tag
        id: image-tag
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          echo "============================================"
          echo "IMAGE TAG"
          echo "============================================"
          echo "${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile

          push: true

          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.image-tag.outputs.tag }}

          cache-from: type=gha,scope=hireflow-backend
          cache-to: type=gha,mode=max,scope=hireflow-backend

      - name: Build and Push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile

          push: true

          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}

          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.image-tag.outputs.tag }}

          cache-from: type=gha,scope=hireflow-frontend
          cache-to: type=gha,mode=max,scope=hireflow-frontend

      - name: Verify Published Images
        run: |
          echo "============================================"
          echo "IMAGES PUBLISHED SUCCESSFULLY"
          echo "============================================"

          echo ""
          echo "Backend:"
          echo "${{ env.BACKEND_IMAGE }}:${{ steps.image-tag.outputs.tag }}"

          echo ""
          echo "Frontend:"
          echo "${{ env.FRONTEND_IMAGE }}:${{ steps.image-tag.outputs.tag }}"

          echo ""
          echo "Build Tag:"
          echo "${{ steps.image-tag.outputs.tag }}"

          echo ""
          echo "Application Commit:"
          echo "${GITHUB_SHA}"


  update-gitops:

    name: Update GitOps Repository

    needs: build-and-push

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout GitOps Repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.GITOPS_REPO }}

          token: ${{ secrets.GITOPS_TOKEN }}

          ref: main

          path: gitops

          fetch-depth: 0

          persist-credentials: true

      - name: Verify GitOps Repository
        working-directory: gitops
        run: |
          echo "============================================"
          echo "GITOPS REPOSITORY"
          echo "============================================"

          git remote -v

          echo ""

          git status

          echo ""

          git branch

      - name: Configure Git Identity
        working-directory: gitops
        run: |
          git config user.name "hireflow-deploy-bot"

          git config user.email "hireflow-deploy-bot@users.noreply.github.com"

      - name: Update Backend Image
        run: |
          FILE="gitops/k8s/backend-deployment.yaml"

          if [ ! -f "${FILE}" ]; then
            echo "ERROR: ${FILE} not found"
            exit 1
          fi

          sed -i \
            "s|image: ghcr.io/annusingh1211/hireflow-backend:.*|image: ghcr.io/annusingh1211/hireflow-backend:${{ needs.build-and-push.outputs.image_tag }}|" \
            "${FILE}"

          echo "Updated backend image:"

          grep "image:" "${FILE}"

      - name: Update Frontend Image
        run: |
          FILE="gitops/k8s/frontend-deployment.yaml"

          if [ ! -f "${FILE}" ]; then
            echo "ERROR: ${FILE} not found"
            exit 1
          fi

          sed -i \
            "s|image: ghcr.io/annusingh1211/hireflow-frontend:.*|image: ghcr.io/annusingh1211/hireflow-frontend:${{ needs.build-and-push.outputs.image_tag }}|" \
            "${FILE}"

          echo "Updated frontend image:"

          grep "image:" "${FILE}"

      - name: Show GitOps Changes
        working-directory: gitops
        run: |
          echo "============================================"
          echo "GITOPS CHANGES"
          echo "============================================"

          git diff

      - name: Commit GitOps Changes
        id: commit
        working-directory: gitops
        run: |
          git add \
            k8s/backend-deployment.yaml \
            k8s/frontend-deployment.yaml

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo "No GitOps changes detected."

            exit 0
          fi

          git commit \
            -m "deploy: ${{ needs.build-and-push.outputs.image_tag }}"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push GitOps Changes
        if: steps.commit.outputs.changed == 'true'
        working-directory: gitops
        run: |
          MAX_ATTEMPTS=5

          ATTEMPT=1

          while [ "${ATTEMPT}" -le "${MAX_ATTEMPTS}" ]
          do

            echo ""
            echo "============================================"
            echo "Push attempt ${ATTEMPT}/${MAX_ATTEMPTS}"
            echo "============================================"

            git fetch origin main

            git rebase origin/main

            if git push origin HEAD:main; then

              echo ""
              echo "============================================"
              echo "GITOPS UPDATE PUSHED SUCCESSFULLY"
              echo "============================================"

              exit 0

            fi

            echo "Push failed."

            ATTEMPT=$((ATTEMPT + 1))

            sleep 5

          done

          echo "ERROR: Failed to push GitOps changes."

          exit 1

      - name: Deployment Summary
        run: |
          echo "============================================"
          echo "DEPLOYMENT PIPELINE COMPLETED"
          echo "============================================"

          echo ""

          echo "GitOps Repository:"
          echo "${{ env.GITOPS_REPO }}"

          echo ""

          echo "Image Tag:"
          echo "${{ needs.build-and-push.outputs.image_tag }}"

          echo ""

          echo "Backend:"
          echo "${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}"

          echo ""

          echo "Frontend:"
          echo "${{ env.FRONTEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}"

          echo ""

          echo "Next step:"
          echo "Argo CD detects the GitOps commit and synchronizes Kubernetes."
